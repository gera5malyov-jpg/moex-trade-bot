name: One-time Sandbox lifecycle smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sandbox-lifecycle-smoke.yml"
  schedule:
    # Independent readiness recovery during the Moscow trading day.
    # Off-hours and closed-market attempts do not create a readiness marker.
    - cron: "10,40 7-14 * * 1-5"

# Jobs across alternate entrypoints must not overlap protective lifecycle work.
# Failed sandbox FILL_AND_KILL exits are journaled and reconciled before retry.
permissions:
  contents: read

concurrency:
  group: sandbox-daily-controls
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Verify actual Sandbox entry and protection
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/sandbox_lifecycle_smoke.py

name: API health - T-Invest Sandbox (failure alerts only)
on:
  schedule:
    - cron: '59 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m py_compile scripts/api_health_watch.py
      - name: Read-only broker API probe; email only on confirmed error
        run: python scripts/api_health_watch.py

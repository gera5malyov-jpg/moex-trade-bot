name: T-Invest API status producer
on:
  schedule:
    - cron: '59 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-health-watch.yml'
      - 'scripts/api_health_watch.py'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m py_compile scripts/api_health_watch.py
      - name: Read-only T-Invest API probe
        run: python scripts/api_health_watch.py
      - name: Publish sanitized result for central notifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinvest-api-health-${{ github.run_id }}
          path: reports/tinvest-api-health.json
          if-no-files-found: error
          retention-days: 3

name: Gazpromneft station 17 monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/gazprom_fuel_monitor.py"
      - ".github/workflows/gazprom-fuel-monitor.yml"

permissions:
  contents: read

concurrency:
  group: gazprom-fuel-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install "selenium>=4.25,<5"

      - name: Check fuel and email result
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_SMTP_PORT: "465"
          MAIL_TO: "gera5@list.ru"
        run: python scripts/gazprom_fuel_monitor.py

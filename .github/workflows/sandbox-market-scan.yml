name: Sandbox market scan

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during the intraday entry window.
    # Off-grid minutes reduce GitHub scheduler contention.
    # Moscow = UTC+3: 10:07-16:52 and 17:07-17:37.
    - cron: "7,22,37,52 7-13 * * 1-5"
    - cron: "7,22,37 14 * * 1-5"

permissions:
  contents: read

concurrency:
  group: sandbox-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan and send candidates
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          SCANNER_MAX_PER_TYPE: "4"
          SCANNER_MAX_SIGNALS: "3"
          SCANNER_ANALYSIS_ONLY_MAX_SIGNALS: "0"
          SCANNER_COOLDOWN_MINUTES: "20"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: gera5malyov+trade@gmail.com
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/scan_market.py

name: Sandbox market scan

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sandbox-market-scan.yml"
  # Independent hourly fallback for market analysis when the scheduler hub
  # is delayed or its protective smoke test cannot complete.
  schedule:
    # 10:24-17:24 Moscow (GitHub cron is UTC), 3 minutes after primary.
    - cron: "24 7-14 * * 1-5"

# A signed Sandbox readiness marker is mandatory for executable signals.
# This workflow never directly places a BUY; only reviewed commands can do so.
permissions:
  contents: read

concurrency:
  group: sandbox-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan and send candidates
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          SCANNER_MAX_PER_TYPE: "12"
          SCANNER_MAX_SIGNALS: "3"
          SCANNER_ANALYSIS_ONLY_MAX_SIGNALS: "2"
          SCANNER_COOLDOWN_MINUTES: "60"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: gera5malyov+trade@gmail.com
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/scan_market.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Independent market scan failed after 3 attempts"
              exit 1
            fi
            echo "::warning::Transient scanner failure, retry $attempt"
            sleep 10
          done

name: Bootstrap T-Invest Sandbox

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/bootstrap_sandbox.py"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Create or verify sandbox account
        env:
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
        run: python scripts/bootstrap_sandbox.py

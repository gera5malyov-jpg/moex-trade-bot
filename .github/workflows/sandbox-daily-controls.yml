name: Sandbox daily controls

on:
  workflow_dispatch:
  schedule:
    # Resilient scheduler hub. GitHub may delay/drop individual schedule events; recovery is mandatory,
    # so every surviving tick performs all safety-critical reconciliation.
    # GitHub Actions cron uses UTC; 09-18 Moscow = 06-15 UTC.
    - cron: "3/5 6-15 * * 1-5"
    # End-of-day broker snapshot for the just-finished Moscow date.
    - cron: "5 21 * * *"

permissions:
  contents: read

concurrency:
  group: sandbox-daily-controls
  cancel-in-progress: false

jobs:
  trading-cycle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '3/5 6-15 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Ensure signed Moscow-day risk baseline
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/risk_baseline.py

      - name: Reconcile stale/open lifecycle before any new work
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          TRADING_ENABLED: "true"
        run: python scripts/monitor_lifecycle.py

      - name: Ensure today's Sandbox readiness
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          TRADING_ENABLED: "false"
        run: python scripts/sandbox_lifecycle_smoke.py

      - name: Process fresh trade commands
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          TRADING_ENABLED: "true"
          COMMAND_MAX_AGE_MINUTES: ${{ vars.COMMAND_MAX_AGE_MINUTES || '15' }}
          SIGNAL_MAX_AGE_MINUTES: ${{ vars.SIGNAL_MAX_AGE_MINUTES || '90' }}
        run: python scripts/process_commands.py

      - name: Reconcile lifecycle after command processing
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          TRADING_ENABLED: "true"
        run: python scripts/monitor_lifecycle.py

      - name: Scan market once per hour window
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          TRADING_ENABLED: "false"
          SCANNER_MAX_PER_TYPE: "6"
          SCANNER_MAX_SIGNALS: "3"
          SCANNER_ANALYSIS_ONLY_MAX_SIGNALS: "0"
          SCANNER_COOLDOWN_MINUTES: "20"
          MAIL_TO: gera5malyov+trade@gmail.com
        shell: bash
        run: |
          set -euo pipefail
          HOUR="$(TZ=Europe/Moscow date +%H)"
          MINUTE="$(TZ=Europe/Moscow date +%M)"
          # Any surviving tick in minutes 03..17 can cover the hourly scan.
          # Instrument-level cooldown prevents duplicate executable signals.
          if [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 17 ] && [ "$MINUTE" -ge 3 ] && [ "$MINUTE" -le 17 ]; then
            python scripts/scan_market.py
          else
            echo "Outside hourly scan recovery window; safety cycle completed."
          fi

  daily-snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '5 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send broker snapshot
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          DAILY_SNAPSHOT_PREVIOUS_MOSCOW_DAY: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: gera5malyov@gmail.com
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/daily_snapshot.py

name: Sandbox daily controls

on:
  workflow_dispatch:
  schedule:
    # 06:00 Moscow on weekdays.
    - cron: "0 3 * * 1-5"
    # 09:55 Moscow on weekdays: refresh broker-protection readiness
    # immediately before the 10:05+ executable scan window.
    - cron: "55 6 * * 1-5"
    # End-of-day broker snapshot: 00:05 Moscow next calendar day.
    # The snapshot script is told to report the just-finished Moscow date.
    - cron: "5 21 * * *"
    # Market scanner: 10:07-17:07 Moscow, hourly on weekdays.
    - cron: "7 7-14 * * 1-5"
    # Command processor + protective lifecycle heartbeat: every 5 minutes
    # across the intraday execution/cleanup window.
    - cron: "48,53,58 6 * * 1-5"
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 7-14 * * 1-5"
    - cron: "3,8,13,18,23,28,33,38,43 15 * * 1-5"

permissions:
  contents: read

jobs:
  risk-baseline:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sandbox-risk-baseline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Create signed risk baseline
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/risk_baseline.py

  sandbox-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '55 6 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: sandbox-daily-readiness
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ensure today's signed risk baseline exists
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/risk_baseline.py
      - name: Verify protected Sandbox lifecycle and refresh readiness
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/sandbox_lifecycle_smoke.py

  market-scan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7 7-14 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: sandbox-market-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan market candidates
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          SCANNER_MAX_PER_TYPE: "6"
          SCANNER_MAX_SIGNALS: "3"
          SCANNER_ANALYSIS_ONLY_MAX_SIGNALS: "0"
          SCANNER_COOLDOWN_MINUTES: "20"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: gera5malyov+trade@gmail.com
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/scan_market.py

  trading-heartbeat:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '48,53,58 6 * * 1-5' ||
      github.event.schedule == '3,8,13,18,23,28,33,38,43,48,53,58 7-14 * * 1-5' ||
      github.event.schedule == '3,8,13,18,23,28,33,38,43 15 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sandbox-trading-heartbeat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process fresh trade commands
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          COMMAND_MAX_AGE_MINUTES: ${{ vars.COMMAND_MAX_AGE_MINUTES || '15' }}
          SIGNAL_MAX_AGE_MINUTES: ${{ vars.SIGNAL_MAX_AGE_MINUTES || '90' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/process_commands.py
      - name: Monitor protective lifecycle
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/monitor_lifecycle.py

  daily-snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sandbox-daily-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send broker snapshot
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          DAILY_SNAPSHOT_PREVIOUS_MOSCOW_DAY: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: gera5malyov@gmail.com
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/daily_snapshot.py

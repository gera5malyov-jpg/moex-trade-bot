name: Process trade commands

on:
  workflow_dispatch:
  # Backup after the hourly ChatGPT Sandbox reviewer (at :30 Moscow).
  schedule:
    - cron: "35,40 7-14 * * 1-5"

# Hard executor checks signed daily readiness/baseline and signal freshness.
permissions:
  contents: read

concurrency:
  # Serialize with the primary scheduler to prevent parallel command attempts.
  group: sandbox-daily-controls
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Process commands
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          COMMAND_MAX_AGE_MINUTES: ${{ vars.COMMAND_MAX_AGE_MINUTES || '15' }}
          SIGNAL_MAX_AGE_MINUTES: ${{ vars.SIGNAL_MAX_AGE_MINUTES || '90' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/process_commands.py

      - name: Monitor existing protective lifecycle
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/monitor_lifecycle.py

name: Daily sandbox risk baseline
# one-time live baseline verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/risk-baseline.yml"
  schedule:
    # 06:00 Moscow = 03:00 UTC. The baseline is taken before the intraday
    # scanner becomes active.
    - cron: "0 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-sandbox-risk-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send durable daily risk baseline
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "false"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/risk_baseline.py

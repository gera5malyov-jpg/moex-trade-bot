name: Sandbox trading heartbeat

on:
  workflow_dispatch:
  schedule:
    # Weekdays 09:45-18:45 Moscow. Avoid minute 0 where GitHub cron is busiest.
    - cron: "45,50,55 6 * * 1-5"
    - cron: "*/5 7-14 * * 1-5"
    - cron: "5,10,15,20,25,30,35,40,45 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: sandbox-trading-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process fresh trade commands
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          COMMAND_MAX_AGE_MINUTES: ${{ vars.COMMAND_MAX_AGE_MINUTES || '15' }}
          SIGNAL_MAX_AGE_MINUTES: ${{ vars.SIGNAL_MAX_AGE_MINUTES || '90' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/process_commands.py
      - name: Monitor protective lifecycle
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/monitor_lifecycle.py

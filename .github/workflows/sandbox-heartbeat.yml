name: Sandbox trading heartbeat

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sandbox market scan"]
    types: [completed]
  schedule:
    # Weekdays 09:48-18:43 Moscow. Use off-grid minutes to reduce
    # GitHub scheduler contention from common */5 cron expressions.
    - cron: "48,53,58 6 * * 1-5"
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 7-14 * * 1-5"
    - cron: "3,8,13,18,23,28,33,38,43 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: sandbox-trading-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Allow Outlook and reviewer to produce a command
        if: github.event_name == 'workflow_run'
        run: sleep 180
      - name: Process fresh trade commands
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          COMMAND_MAX_AGE_MINUTES: ${{ vars.COMMAND_MAX_AGE_MINUTES || '15' }}
          SIGNAL_MAX_AGE_MINUTES: ${{ vars.SIGNAL_MAX_AGE_MINUTES || '90' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/process_commands.py
      - name: Monitor protective lifecycle
        env:
          PYTHONPATH: src
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          TINVEST_SANDBOX_ACCOUNT_NAME: github-moex-trade-bot
          TRADING_ENABLED: "true"
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_IMAP_HOST: ${{ vars.MAIL_IMAP_HOST || 'imap.gmail.com' }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
        run: python scripts/monitor_lifecycle.py
